<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poko Tax</title>
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #e3f2fd; /* Light blue background */
            margin: 0;
            padding: 30px 20px;
            color: #333;
            text-align: center;
        }

        /* Intro Section Style */
        #intro-section {
            margin-top: 120px;
        }
        #intro-section h1 {
            font-size: 42px;
            color: #0d47a1;
            margin-bottom: 10px;
            font-weight: 600;
        }
        #intro-section p {
            color: #555;
            font-size: 16px;
            margin-bottom: 30px;
            font-weight: 300;
        }
        .get-started-btn {
            padding: 14px 32px;
            background-color: #1976d2;
            color: black;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            transition: background-color 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .get-started-btn:hover {
            background-color: #115293;
        }

        /* Main Section Style (Hidden by default) */
        #main-section {
            display: none;
        }
        header h1 {
            color: #0d47a1;
            margin-bottom: 5px;
            font-weight: 600;
        }
        header p {
            color: #555;
            font-weight: 300;
        }
        .search-container {
            margin: 30px 0;
        }
        .search-container input {
            padding: 12px 15px;
            width: 300px;
            border: 1px solid #90caf9;
            border-radius: 6px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            outline: none;
            background-color: #fff;
        }
        .search-container input:focus {
            border-color: #1976d2;
            box-shadow: 0 0 5px rgba(25, 118, 210, 0.3);
        }
        .search-container button {
            padding: 12px 20px;
            background-color: #1976d2;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            font-weight: 600;
            margin-left: 5px;
            transition: background-color 0.2s;
        }
        .search-container button:hover {
            background-color: #115293;
        }
        .video-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
            max-width: 1000px;
            margin: 0 auto;
        }
        .video-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            width: 300px;
            text-align: left;
        }
        .video-card h3 {
            font-size: 16px;
            margin-top: 0;
            margin-bottom: 12px;
            color: #222;
        }
        video {
            width: 100%;
            border-radius: 6px;
            background-color: #000;
        }
        .download-btn {
            display: block;
            margin-top: 15px;
            padding: 10px 15px;
            background-color: #2e7d32;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            transition: background-color 0.2s;
        }
        .download-btn:hover {
            background-color: #1b5e20;
        }
    </style>
</head>
<body>

    <!-- 1. Intro Section -->
    <div id="intro-section">
        <h1>Welcome to Poko Tax</h1>
        <p>Your ultimate destination for tax guides and video resources.</p>
        <button class="get-started-btn" onclick="showMainSection()">Get Started</button>
    </div>

    <!-- 2. Main Section (Search & Videos - Hidden initially) -->
    <div id="main-section">
        <header>
            <h1>Poko Tax Video Hub</h1>
            <p>Search and download your required videos easily!</p>
        </header>

        <!-- Search Bar -->
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search videos..." onkeyup="searchVideos()">
            <button onclick="searchVideos()">Search</button>
        </div>

        <!-- Video Grid Section -->
        <div class="video-grid" id="videoGrid">
            
            <!-- Video Card 1 -->
            <div class="video-card" data-title="Poko Tax Tutorial">
                <h3>Poko Tax Tutorial</h3>
                <video controls>
                    <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
                <a href="https://www.w3schools.com/html/mov_bbb.mp4" class="download-btn" download>Download Video</a>
            </div>

            <!-- Video Card 2 -->
            <div class="video-card" data-title="Tax Filing Guide">
                <h3>Tax Filing Guide</h3>
                <video controls>
                    <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
                <a href="https://www.w3schools.com/html/mov_bbb.mp4" class="download-btn" download>Download Video</a>
            </div>

        </div>
    </div>

    <!-- JavaScript to Handle Screen Switch and Search -->
    <script>
        function showMainSection() {
            // Hide intro and show main section
            document.getElementById('intro-section').style.display = 'none';
            document.getElementById('main-section').style.display = 'block';
        }

        function searchVideos() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('video-card');
            
            for (let i = 0; i < cards.length; i++) {
                let title = cards[i].getAttribute('data-title').toLowerCase();
                if (title.includes(input)) {
                    cards[i].style.display = "block";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }
    </script>
</body>
</html>
